site_name: Documentação de Dados Starbucks
site_url: "https://well-cre.github.io/starbucks/"

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/images/starbucks-logo.png  # Caminho para o teu logótipo
  # favicon: assets/images/favicon.ico   # Opcional: ícone do separador do browser
  language: pt
  palette:
    # Alternador de tema claro/escuro
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

nav:
  - Início: index.md
  - Camadas: camadas.md
  - Marts: marts.md
  - Testes: testes.md
  - Checklist de Conformidade: checklist.md
  - Dashboard: dashboard.md
  - Comandos: comandos.md